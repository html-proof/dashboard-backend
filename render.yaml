services:
  - type: web
    name: dashboard-backend
    runtime: node
    plan: starter            # persistent disk (needed for SQLite) requires a paid plan
    region: singapore
    branch: main
    autoDeploy: false        # GitHub Actions triggers deploys only after tests pass
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:/var/data/app.db
      - key: SHOPIFY_API_VERSION
        value: "2026-07"
      - key: SHOPIFY_SCOPES
        value: read_orders,read_all_orders,read_customers,read_products,read_inventory,read_locations,read_fulfillments,read_reports
      - key: SYNC_INTERVAL_SECONDS
        value: "10"
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      - key: SHOPIFY_STORE
        sync: false
      - key: DASHBOARD_API_KEY
        sync: false
